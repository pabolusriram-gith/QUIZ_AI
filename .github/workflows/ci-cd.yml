name: QuizVerse AI CI/CD Build & Verification

on:
  push:
    branches: [ main, master, release-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Test & Safety Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff httpx pip-audit

      - name: Lint with Ruff
        run: ruff check app/ --exit-zero

      - name: Check for security vulnerabilities in dependencies
        run: pip-audit --desc on || true # Note: run audit but do not block build if non-critical issues are found

  frontend-checks:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present || true

      - name: Next.js Compile / Build Check
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://quizverse.ai/api/v1
          NEXT_TELEMETRY_DISABLED: 1

  docker-build-validation:
    name: Validate Production Docker Builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build backend production image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false

      - name: Test build frontend production image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false

      - name: Test build nginx reverse proxy image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
